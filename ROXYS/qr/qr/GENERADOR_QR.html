<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Generador QR Roxy</title>
<style>
body{font-family:Arial;background:#f5f5f5;margin:0;padding:30px}.box{max-width:620px;margin:auto;background:white;border-radius:20px;padding:25px}input{width:100%;padding:13px;box-sizing:border-box;border:1px solid #ccc;border-radius:10px;margin:8px 0 15px}button{padding:12px 18px;border:0;border-radius:10px;background:#18181b;color:#fff}#qr{text-align:center;margin-top:25px}
</style>
</head>
<body>
<div class="box">
<h1>QR Cremoladas Roxy</h1>
<p>Coloca aquí la dirección pública donde estará alojado <b>cliente/index.html</b>.</p>
<input id="url" placeholder="https://tu-dominio/cliente/">
<button onclick="generar()">Generar QR</button>
<div id="qr"></div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
function generar(){const u=document.getElementById("url").value.trim();if(!u)return;document.getElementById("qr").innerHTML="";new QRCode(document.getElementById("qr"),{text:u,width:280,height:280});}
</script>
</body>
</html>
