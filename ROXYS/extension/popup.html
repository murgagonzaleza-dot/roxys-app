<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cremoladas Roxy - Control de Asistencia</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="popup.css">
</head>
<body>
    <main class="login-container">
        <!-- Encabezado de la App -->
        <header class="app-header">
            <div class="brand-badge">
                <span class="brand-icon" aria-hidden="true">🍦</span>
            </div>
            <div class="brand-info">
                <h1 class="brand-title">Cremoladas Roxy</h1>
                <p class="brand-subtitle">Control de Asistencia</p>
            </div>
        </header>

        <!-- Tarjeta Principal de Registro -->
        <section class="login-card">
            <div class="avatar-icon" aria-hidden="true">
                <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                    <circle cx="12" cy="7" r="4"></circle>
                </svg>
            </div>

            <h2 class="card-title">Marcación de Turno</h2>
            <p class="card-description">Ingresa tu nombre completo para registrar la entrada o salida de tu turno.</p>

            <form id="formMarcacion" class="form-group" onsubmit="return false;">
                <div class="input-wrapper">
                    <input 
                        id="nombreCajero" 
                        type="text" 
                        placeholder="Ej. María García" 
                        autocomplete="off" 
                        maxlength="100" 
                        required
                        aria-label="Nombre completo del cajero"
                    >
                </div>

                <button type="submit" id="marcarAsistencia" class="btn-primary">
                    <span>REGISTRAR MARCACIÓN</span>
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="5" y1="12" x2="19" y2="12"></line>
                        <polyline points="12 5 19 12 12 19"></polyline>
                    </svg>
                </button>
            </form>

            <div id="mensaje" class="status-message" role="alert" aria-live="polite"></div>
        </section>

        <!-- Pie de página -->
        <footer class="app-footer">
            <span class="status-indicator">● Sistema en línea</span>
            <span class="version">v1.0</span>
        </footer>
    </main>

    <script src="popup.js"></script>
</body>
</html>
